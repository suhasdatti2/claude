<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Nick Jr's Burgers and Gyros logo">
  <defs>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c873"/>
      <stop offset="1" stop-color="#e3a44a"/>
    </linearGradient>
    <linearGradient id="bunBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3a44a"/>
      <stop offset="1" stop-color="#c8893a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.55" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#d62828"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2118"/>
      <stop offset="1" stop-color="#3c2c1d"/>
    </linearGradient>
  </defs>

  <!-- outer badge -->
  <circle cx="120" cy="120" r="116" fill="url(#ring)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#e3a44a" stroke-width="3"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#e3a44a" stroke-width="1.5" stroke-dasharray="2 6"/>
  <circle cx="120" cy="120" r="92" fill="#fbf3e4"/>

  <!-- curved top text -->
  <path id="topArc" d="M 120 26 m -82 0 a 82 82 0 0 1 164 0" fill="none"/>
  <path id="botArc" d="M 120 214 m -82 0 a 82 82 0 0 0 164 0" fill="none"/>
  <text fill="#2b2118" font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle" font-size="17">NICK JR&#39;S</textPath>
  </text>
  <text fill="#c8893a" font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="3">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle" font-size="13">BURGERS &amp; GYROS</textPath>
  </text>

  <!-- flames behind burger -->
  <g transform="translate(120 118)">
    <path d="M -34 18 C -40 -8 -20 -14 -22 -34 C -8 -22 -4 -30 -2 -44 C 6 -28 22 -28 18 -8 C 32 -14 38 4 28 18 Z" fill="url(#flame)" opacity="0.9"/>
  </g>

  <!-- burger -->
  <g transform="translate(120 124)">
    <!-- top bun -->
    <path d="M -48 -10 C -48 -40 48 -40 48 -10 Z" fill="url(#bun)"/>
    <ellipse cx="-22" cy="-26" rx="3" ry="2" fill="#fff4dd"/>
    <ellipse cx="-2" cy="-31" rx="3" ry="2" fill="#fff4dd"/>
    <ellipse cx="20" cy="-26" rx="3" ry="2" fill="#fff4dd"/>
    <ellipse cx="8" cy="-22" rx="3" ry="2" fill="#fff4dd"/>
    <!-- lettuce -->
    <path d="M -50 -8 q 12 10 25 0 q 12 10 25 0 q 12 10 25 0 q 12 -2 23 2 l 0 4 -146 0 0 -2 q 8 -6 23 -4 Z" fill="#7cb342"/>
    <!-- patty -->
    <rect x="-50" y="-2" width="100" height="14" rx="7" fill="#5a3520"/>
    <!-- cheese -->
    <path d="M -50 -4 l 100 0 -14 14 -16 -8 -16 8 -16 -8 -16 8 -16 -8 Z" fill="#f6b93b"/>
    <!-- bottom bun -->
    <path d="M -48 12 L 48 12 C 48 26 -48 26 -48 12 Z" fill="url(#bunBottom)"/>
  </g>

  <!-- star accents -->
  <g fill="#c8893a">
    <circle cx="40" cy="120" r="3"/>
    <circle cx="200" cy="120" r="3"/>
  </g>
</svg>
